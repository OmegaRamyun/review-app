<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review App</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Review App</h1>
      <details id="settings">
        <summary>Settings</summary>
        <label>Deepgram API key
          <input id="dg-key" type="password" autocomplete="off" placeholder="paste once — stored in the OS keychain" />
        </label>
        <button id="dg-save">Save key</button>
        <button id="dg-clear">Forget key</button>
        <span id="dg-status"></span>
        <label>Deepgram model <input id="dg-model" type="text" placeholder="nova-3" /></label>
      </details>
    </header>

    <!-- 1. Import -->
    <section id="screen-import" class="screen">
      <div id="drop" class="drop">Drop an OBS MKV here</div>
      <div id="import-info" hidden>
        <table>
          <tr><th>File</th><td id="i-name"></td></tr>
          <tr><th>Path</th><td id="i-path"></td></tr>
          <tr><th>Size</th><td id="i-size"></td></tr>
          <tr><th>Duration</th><td id="i-dur"></td></tr>
          <tr><th>Resolution</th><td id="i-res"></td></tr>
        </table>
        <fieldset>
          <legend>Mic track (transcribed — nothing else is sent)</legend>
          <div id="i-tracks"></div>
        </fieldset>
        <button id="b-transcribe">Transcribe</button>
      </div>
      <p id="import-error" class="error"></p>
    </section>

    <!-- 2. Transcribe -->
    <section id="screen-transcribe" class="screen" hidden>
      <progress id="t-bar" max="1" value="0"></progress>
      <p id="t-status"></p>
      <p id="t-error" class="error"></p>
      <button id="t-retry" hidden>Retry</button>
      <button id="t-next" hidden>Scrub &amp; point →</button>
    </section>

    <!-- 3. Scrub & point -->
    <section id="screen-scrub" class="screen" hidden>
      <div class="scrub">
        <div class="player">
          <video id="video" controls preload="metadata"></video>
          <div class="transport">
            <button id="v-back">−5s</button>
            <button id="v-play">Play/Pause</button>
            <button id="v-fwd">+5s</button>
            <select id="v-speed">
              <option value="0.5">0.5×</option><option value="1" selected>1×</option>
              <option value="1.5">1.5×</option><option value="2">2×</option>
            </select>
            <span id="v-time">0:00</span>
            <button id="v-shot" title="Grab the current frame into the point being composed">Screenshot</button>
          </div>
          <p id="v-error" class="error"></p>
        </div>
        <ol id="lines" class="lines"></ol>

        <!-- point composer -->
        <div class="composer-box">
          <p id="c-empty" class="hint">Pin a transcript line (📌) to start a point.</p>
          <form id="composer" hidden>
            <div class="c-quote"><button type="button" id="c-time" class="linkish" title="Jump to this moment"></button> <q id="c-quote"></q></div>
            <textarea id="c-text" rows="3" placeholder="Your point…"></textarea>
            <div class="c-row">
              <label>Bucket <select id="c-bucket"></select></label>
              <button type="button" id="c-shot">Screenshot current frame</button>
              <button type="button" id="c-shot-clear" hidden>Remove screenshot</button>
            </div>
            <img id="c-thumb" class="thumb" alt="screenshot" hidden />
            <div class="c-row">
              <button type="submit" id="c-save">Save point</button>
              <button type="button" id="c-cancel">Cancel</button>
              <span id="c-status"></span>
            </div>
          </form>
        </div>

        <!-- points list -->
        <div class="points">
          <div class="p-bar">
            <label>Mode <select id="s-mode">
              <option value="full">Full (14 buckets)</option>
              <option value="rapid">Rapid / demo day (6)</option>
            </select></label>
            <label>Filter <select id="p-filter"></select></label>
            <span id="p-count"></span>
          </div>
          <ol id="p-list" class="p-list"></ol>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
