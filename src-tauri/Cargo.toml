[package]
name = "review-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "review_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
# Blocking HTTP client for the Deepgram upload: rustls + ring (no OpenSSL,
# no aws-lc-sys/cmake), webpki-roots baked in. Runs inside spawn_blocking.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Cloudflare Pages direct upload (DESIGN.md: Publish via the direct-upload API):
# asset keys must be wrangler's exact BLAKE3 hash or uploads 404 silently.
# `pure` = portable Rust only, no C/asm build step on Windows.
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.release]
strip = true
